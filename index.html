<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Team Coach App - Spirit</title>
    <!-- Tailwind CSS voor strakke styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PWA / Apple Touch Icon configuratie met het geüploade logo -->
    <link rel="apple-touch-icon" href="IMG_0119.jpeg">
    <link rel="icon" type="image/jpeg" href="IMG_0119.jpeg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans select-none">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <img src="IMG_0119.jpeg" alt="Spirit Logo" class="w-10 h-10 object-cover rounded-full bg-white p-0.5 shadow">
            <div>
                <h1 id="team-title" class="font-bold text-lg text-white leading-tight">Spirit JO16-2</h1>
                <p class="text-xs text-slate-400">Match & Wissel Coach</p>
            </div>
        </div>
        <button onclick="openTeamSettings()" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded-lg border border-slate-600 font-medium transition">
            Team / Reset
        </button>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 p-4 max-w-md mx-auto w-full flex flex-col justify-center items-center text-center space-y-6">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl w-full space-y-4">
            <h2 class="text-xl font-bold text-emerald-400">Coach Dashboard</h2>
            <p class="text-sm text-slate-300">Beheer hier je line-ups en bedien de vrije wedstrijdtimer.</p>
            
            <!-- Line-up actieknoppen -->
            <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="addLineUp()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 px-3 rounded-xl shadow transition flex items-center justify-center space-x-1">
                    <span>+ line-up</span>
                </button>
                <button onclick="openDeleteLineUpModal()" class="bg-rose-600/20 hover:bg-rose-600/30 text-rose-400 border border-rose-500/30 font-semibold py-2.5 px-3 rounded-xl shadow transition flex items-center justify-center space-x-1">
                    <span>- line-up</span>
                </button>
            </div>

            <!-- Vrije Timer Display & Besturing -->
            <div class="bg-slate-900/60 border border-slate-700 rounded-xl p-4 space-y-3 mt-4">
                <div id="match-timer-display" class="text-3xl font-mono font-bold text-white tracking-wider">00:00</div>
                <div class="grid grid-cols-3 gap-2">
                    <button id="timer-start-btn" onclick="toggleTimer()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2 px-2 rounded-lg transition">
                        Start
                    </button>
                    <button onclick="pauseTimer()" class="bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold py-2 px-2 rounded-lg transition">
                        Pauze
                    </button>
                    <button onclick="endMatch()" class="bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold py-2 px-2 rounded-lg transition">
                        Einde
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal / Instellingen & Reset -->
    <div id="settings-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 w-full max-w-sm space-y-4 shadow-2xl">
            <h3 class="text-lg font-bold text-white">Team & Instellingen</h3>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Teamnaam:</label>
                <input type="text" id="team-name-input" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500" value="Spirit JO16-2">
            </div>
            
            <div class="pt-2 border-t border-slate-700 flex flex-col space-y-2">
                <button onclick="saveTeamName()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold py-2.5 rounded-xl transition">
                    Opslaan
                </button>
                <button onclick="resetApp()" class="w-full bg-rose-600/20 hover:bg-rose-600/30 text-rose-400 border border-rose-500/30 text-sm font-semibold py-2.5 rounded-xl transition">
                    🔄 Reset App (Leegmaken & Nieuw Team)
                </button>
                <button onclick="closeTeamSettings()" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-300 text-sm font-medium py-2 rounded-xl transition">
                    Annuleren
                </button>
            </div>
        </div>
    </div>

    <!-- Modal / Verwijder Line-up (- line-up) -->
    <div id="delete-lineup-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 w-full max-w-sm space-y-4 shadow-2xl">
            <h3 class="text-lg font-bold text-white">Selecteer line-up om te verwijderen</h3>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Kies line-up:</label>
                <select id="lineup-select-delete" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-rose-500">
                    <!-- Wordt dynamisch gevuld -->
                </select>
            </div>
            
            <div class="pt-2 border-t border-slate-700 flex flex-col space-y-2">
                <button onclick="confirmDeleteLineUp()" class="w-full bg-rose-600 hover:bg-rose-500 text-white text-sm font-semibold py-2.5 rounded-xl transition">
                    Verwijder geselecteerde line-up
                </button>
                <button onclick="closeDeleteLineUpModal()" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-300 text-sm font-medium py-2 rounded-xl transition">
                    Annuleren
                </button>
            </div>
        </div>
    </div>

    <!-- Script voor functionaliteit -->
    <script>
        let secondsElapsed = 0;
        let timerInterval = null;
        let isRunning = false;

        function getLineUps() {
            let data = localStorage.getItem('spirit_lineups');
            if (!data) {
                data = JSON.stringify(["Basis 4-4-2", "Aanvallend 4-3-3", "Compacte Blokkade"]);
                localStorage.setItem('spirit_lineups', data);
            }
            return JSON.parse(data);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedTeam = localStorage.getItem('spirit_team_name');
            if (savedTeam) {
                document.getElementById('team-title').innerText = savedTeam;
                document.getElementById('team-name-input').value = savedTeam;
            }
        });

        function toggleTimer() {
            if (!isRunning) {
                isRunning = true;
                document.getElementById('timer-start-btn').innerText = 'Hervat';
                document.getElementById('timer-start-btn').classList.remove('bg-emerald-600', 'hover:bg-emerald-500');
                document.getElementById('timer-start-btn').classList.add('bg-blue-600', 'hover:bg-blue-500');
                
                timerInterval = setInterval(() => {
                    secondsElapsed++;
                    updateTimerDisplay();
                }, 1000);
            }
        }

        function pauseTimer() {
            if (isRunning) {
                isRunning = false;
                clearInterval(timerInterval);
                document.getElementById('timer-start-btn').innerText = 'Start';
                document.getElementById('timer-start-btn').classList.remove('bg-blue-600', 'hover:bg-blue-500');
                document.getElementById('timer-start-btn').classList.add('bg-emerald-600', 'hover:bg-emerald-500');
            }
        }

        function endMatch() {
            if (confirm('Wil je de wedstrijd beëindigen en de timer resetten?')) {
                pauseTimer();
                secondsElapsed = 0;
                updateTimerDisplay();
                alert('Wedstrijd beëindigd.');
            }
        }

        function updateTimerDisplay() {
            const mins = Math.floor(secondsElapsed / 60);
            const secs = secondsElapsed % 60;
            document.getElementById('match-timer-display').innerText = 
                String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
        }

        function openTeamSettings() {
            document.getElementById('settings-modal').classList.remove('hidden');
            document.getElementById('settings-modal').classList.add('flex');
        }

        function closeTeamSettings() {
            document.getElementById('settings-modal').classList.add('hidden');
            document.getElementById('settings-modal').classList.remove('flex');
        }

        function saveTeamName() {
            const newName = document.getElementById('team-name-input').value;
            if (newName.trim() !== '') {
                localStorage.setItem('spirit_team_name', newName);
                document.getElementById('team-title').innerText = newName;
            }
            closeTeamSettings();
        }

        function resetApp() {
            if (confirm('Weet je zeker dat je alle data, opstellingen en het team wilt wissen om met een schone lei te beginnen?')) {
                localStorage.clear();
                localStorage.setItem('spirit_team_name', 'Nieuw Team');
                alert('De app is gereset.');
                location.reload();
            }
        }

        function addLineUp() {
            const name = prompt("Voer de naam van de nieuwe line-up in (bijv. '2e helft - Standaard'):");
            if (name && name.trim() !== '') {
                let lineups = getLineUps();
                lineups.push(name.trim());
                localStorage.setItem('spirit_lineups', JSON.stringify(lineups));
                alert(`Line-up '${name}' is toegevoegd!`);
            }
        }

        function openDeleteLineUpModal() {
            let lineups = getLineUps();
            const select = document.getElementById('lineup-select-delete');
            select.innerHTML = '';
            
            if (lineups.length === 0) {
                select.innerHTML = '<option value="">Geen line-ups beschikbaar</option>';
            } else {
                lineups.forEach(l => {
                    let opt = document.createElement('option');
                    opt.value = l;
                    opt.textContent = l;
                    select.appendChild(opt);
                });
            }

            document.getElementById('delete-lineup-modal').classList.remove('hidden');
            document.getElementById('delete-lineup-modal').classList.add('flex');
        }

        function closeDeleteLineUpModal() {
            document.getElementById('delete-lineup-modal').classList.add('hidden');
            document.getElementById('delete-lineup-modal').classList.remove('flex');
        }

        function confirmDeleteLineUp() {
            const select = document.getElementById('lineup-select-delete');
            const selectedVal = select.value;
            
            if (!selectedVal) {
                alert('Selecteer eerst een line-up.');
                return;
            }

            if (confirm(`Weet je zeker dat je line-up '${selectedVal}' wilt verwijderen?`)) {
                let lineups = getLineUps();
                lineups = lineups.filter(l => l !== selectedVal);
                localStorage.setItem('spirit_lineups', JSON.stringify(lineups));
                alert(`Line-up '${selectedVal}' is verwijderd.`);
                closeDeleteLineUpModal();
            }
        }
    </script>
</body>
</html>
